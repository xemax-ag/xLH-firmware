{% extends "base.html" %}

{% block content %}
<div class="ms-3 me-3 mt-3">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <form>
                <div class="mb-3">
                    <label for="ssid" class="form-label">SSID</label><br>
                    <input type="text" class="form-control" id="ssid" name="ssid" value="">
                </div>
                <div class="mb-3">
                    <label for="psk" class="form-label">Password</label><br>
                    <input type="password" class="form-control" id="psk" name="psk" value="">
                </div>
                <button class="btn btn-primary"
                        hx-post="/wifi/config/"
                        hx-target="#query-data" hx-swap="innerHTML"
                        hx-indicator="#spinner">
                    Submit WiFi Login
                    <img id="spinner" class="htmx-indicator" src="/static/img/spinners/bars-scale-middle.svg"
                         style="height: 12px" alt="">
                </button>
            </form>
            <p id="query-data"></p>
        </div>
    </div>
</div>
{% endblock %}
